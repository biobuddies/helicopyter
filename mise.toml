[env]
# Placeholders render deploys here and in GitHub Actions
ALLOWEDFLARE_EMAIL = "{{ get_env(name='ALLOWEDFLARE_EMAIL', default='person@emailprovider.example') }}"
ALLOWEDFLARE_PRIVATE_DOMAIN = "{{ get_env(name='ALLOWEDFLARE_PRIVATE_DOMAIN', default='organization.example') }}"
CLOUDFLARE_ACCOUNT_ID = "{{ get_env(name='CLOUDFLARE_ACCOUNT_ID', default='0123456789abcdef0123456789abcdef00') }}"
CLOUDFLARE_ZONE_ID = "{{ get_env(name='CLOUDFLARE_ZONE_ID', default='0123456789abcdef0123456789abcdef01') }}"

# Override .config/mise.toml from https://github.com/biobuddies/measles

[tasks.pre-commit-all]
# TODO harmonize pyproject.toml packaging then drop this override to restore mise cookiecutter
run = '''
#!/usr/bin/env bash
set -o errexit -o nounset -o pipefail
mise pre-commit "$@"
mise lychee  # Requires Internet
mise uv-pip-compile  # needs Internet
[[ $(mise envi) == local ]] || { git diff --color=always --exit-code; exit $?; }
git diff --cached --quiet || echo Auto-staged modifications
'''

[tasks.test]
run = '''
#!/usr/bin/env bash
set -o errexit -o nounset -o pipefail
for cona in demo demojampublic demojamstaff; do mise tvalid "$cona"; done
mise build
python -m pytest --cov${PYTEST_COV-} \
    --cov-report=term-missing:skip-covered --verbose "$@"
'''

[tasks.tvalid]
# TODO measles tact validate initializes the backend, which demos lack credentials for
run = """
#!/usr/bin/env bash
set -o errexit -o nounset -o pipefail
cona=${1:?missing cona}
shift
python -m helicopyter --format_with="$INSH_TF" "$cona"
"$INSH_TF" -chdir="deploys/$cona/terraform" init -backend=false
"$INSH_TF" -chdir="deploys/$cona/terraform" validate "$@"
"""

[tools]
'aqua:tofuutils/tenv' = '4.9.3'
gh = 'latest'
just = '1.36.0'
