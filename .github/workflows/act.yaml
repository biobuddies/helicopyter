concurrency:
    group: ${{ github.workflow }}-${{ github.event_name == 'push' && 'main' || github.ref }}
    cancel-in-progress: ${{ github.event_name != 'push' }}
defaults:
    run:
        shell: bash --noprofile --norc -o errexit -o nounset -o pipefail -o xtrace {0}
env:
    INSH_TF: tofu
    PATH: .venv/bin:/home/runner/.local/bin:/home/runner/.local/share/mise/shims:/usr/bin:/bin
    TENV_GITHUB_TOKEN: ${{ github.token }}
name: act
permissions:
    contents: read
jobs:
    check:
        runs-on: ubuntu-latest
        steps:
            # Real hash is head_ref on pull_request, ref on push
            - uses: actions/checkout@v6
              with:
                  fetch-depth: 0
                  ref: ${{ github.head_ref || github.ref }}
            - uses: jdx/mise-action@v3
              with:
                  experimental: true
            - run: mise run set-environment
            - run: mise run pre-commit
            - run: mise tvalid demo
            - run: mise tvalid demojampublic
            - run: mise tvalid demojamstaff
            - run: mise test
            - run: .venv/bin/just build_twine
    tabularize:
        runs-on: ubuntu-latest
        steps:
            # Real hash is head_ref on pull_request, ref on push
            - uses: actions/checkout@v6
              with:
                  fetch-depth: 0
                  ref: ${{ github.head_ref || github.ref }}
            - uses: jdx/mise-action@v3
              with:
                  experimental: true
            - run: mise run tabularize
    publish:
        if: github.event_name == 'release'
        needs: [check]
        permissions:
            id-token: write
        runs-on: ubuntu-latest
        environment: prod
        steps:
            - uses: actions/checkout@v6
              with:
                  fetch-depth: 0
            - uses: jdx/mise-action@v3
              with:
                  experimental: true
            - run: mise run set-environment
            - run: .venv/bin/just build_twine
            - uses: pypa/gh-action-pypi-publish@release/v1

on: # yamllint disable-line rule:truthy
    pull_request:
    push:
        branches:
            - main
    release:
        types:
            - published
    workflow_dispatch:
run-name: Acting on behalf of ${{ github.actor }}
