concurrency:
    group: ${{ github.workflow }}-${{ github.ref }}
    cancel-in-progress: ${{ github.event_name == 'pull_request' }}

defaults:
    run:
        shell: bash --noprofile --norc -o errexit -o nounset -o pipefail -o xtrace {0}

env:
    GITHUB_TOKEN: ${{ github.token }}

name: provider

permissions:
    contents: read

jobs:
    # Releases attach the provider in act.yaml build-deploy via mise build
    build:
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v7
            - uses: jdx/mise-action@v4
              with:
                  experimental: true
            - run: bash providers/cloudflare/build.bash

on: # yamllint disable-line rule:truthy
    pull_request:
        paths:
            - .github/workflows/provider.yaml
            - providers/cloudflare/**
    workflow_dispatch:

run-name: Building provider on behalf of ${{ github.actor }}
