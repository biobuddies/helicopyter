# AUTOGENERATED from https://github.com/biobuddies/measles
# Override from mise.toml
[settings]
experimental = true
lockfile = true

[settings.python]
uv_venv_auto = 'create|source'

[env]
INSH_TF = 'tofu'
TENV_AUTO_INSTALL = 'true'
# Claude Code on the web blocks api.github.com, such as latest-release queries, but not downloads
TOFUENV_INSTALL_MODE = 'mirror'
TOFUENV_LIST_MODE = 'mirror'
_.path = ['./node_modules/.bin']
_.python.venv = { path = '.venv' }

[hooks]
# Files needing frequent updates.
# See hooks/post_gen_project.bash for files initialized once but rarely updated.
# WARNING: some kind of non-BASH shell on GitHub Actions
postinstall = """
set -o errexit -o nounset
[ -d .git ] || git init --initial-branch=main
npm install --no-audit --no-fund &
npm_pid=$!
uv_status=0
# dup :359 tasks.uv-pip-compile
# Styleforce wheels require manylinux 2.28; uv's generic linux target assumes manylinux 2.17.
uv pip compile --all-extras --output-file requirements.txt --quiet \
    --python-platform x86_64-manylinux_2_28 \
    --python-version 3.12 pyproject.toml \
    && uv venv --allow-existing --quiet \
    && uv pip sync requirements.txt --allow-empty-requirements --quiet \
    || uv_status=$?
wait "$npm_pid"
[ "$uv_status" -eq 0 ] || exit "$uv_status"
mise generate pre-commit > .git/hooks/pre-commit
chmod +x .git/hooks/pre-commit
"""

# Prerequisite tasks
[tasks.cona]
run = 'echo helicopyter'

[tasks.envi]
run = """
#!/usr/bin/env bash
set -o errexit -o nounset -o pipefail
if [[ ${ENVI-} ]]; then echo "$ENVI"
elif [[ ${GITHUB_ACTIONS-} ]]; then echo github
else echo local
fi
"""

[tasks.fqdn]
run = ':'

[tasks.giha]
run = 'git describe --abbrev=40 --always --dirty --match=-'

[tasks.orgn]
run = 'echo biobuddies'

[tasks.run-on-sources]
quiet = true
run = '''
#!/usr/bin/env bash
set -o errexit -o nounset -o pipefail
tool=${1:?missing executable}
set -o noglob
eval "glob=(${2:?missing source glob})"
set +o noglob
shift 2
command_args=$*
: "${AUTOFORMAT_EXCLUDES?}"
set -- $(
    git grep --color=never --files-with-matches -I -e '' -- "${glob[@]}" \
        | grep --invert-match --extended-regexp --file <(
            printf %s "$AUTOFORMAT_EXCLUDES"
        ) || [[ $? -eq 1 ]]
)
[[ $# -eq 0 ]] && exit 0
[[ -z $command_args ]] || set -- $command_args "$@"
"$tool" "$@"
'''

[tasks.tabr]
run = '''
#!/usr/bin/env bash
set -o errexit -o nounset -o pipefail
tag=$(git tag --points-at HEAD --sort=-refname 2>/dev/null | sed -n '1p') || {
    status=$?
    [[ $status == 128 || $status == 129 ]]  # no commits yet or unsupported tag options
}
if [[ $tag ]]; then echo "$tag"
elif [[ ${GITHUB_HEAD_REF-} ]]; then echo "$GITHUB_HEAD_REF"
elif [[ ${GITHUB_REF_NAME-} ]]; then echo "$GITHUB_REF_NAME"
else
    git describe --all --dirty --exact-match 2>/dev/null \
        | sed -En '/-dirty$/ q; s,(remotes/[^/]+|heads|tags)/,,p' || [[ $? -eq 128 ]]
fi
'''

[tasks.tinit]
run = 'mise tact init "$@"'

[tasks.tact]
# Usage: mise tact ACTION [CONA] [ENVI] [ARGUMENTS...]
run = """
#!/usr/bin/env bash
set -o errexit -o nounset -o pipefail
action=${1:?missing action}
shift
conas=$(ls deploys 2>/dev/null || true)
if [[ ${1-} && -d deploys/$1/terraform ]]; then
    cona=$1
    shift
elif [[ $conas != *[[:space:]]* && -d deploys/$conas/terraform ]]; then
    cona=$conas
else
    echo 'Missing or unknown cona' >&2
    exit 1
fi
[[ ${1-} && $1 != -* ]] && envi=$1 && shift || envi=''
if [[ $envi == default ]]; then
    echo 'The default workspace behaves inconsistently.'
    echo 'If you only have one environment, please name it `main`.'
    exit 1
fi
if [[ ! $envi && $action =~ ^(apply|plan)$ ]]; then
    echo 'Missing envi' >&2
    exit 1
fi
python -m helicopyter --format_with="$INSH_TF" "$cona"
if [[ $action == init ]]; then
    "$INSH_TF" -chdir="deploys/$cona/terraform" init "$@"
else
    "$INSH_TF" -chdir="deploys/$cona/terraform" init
fi
# Just trying to create the workspace as needed
[[ ! $envi ]] || "$INSH_TF" -chdir="deploys/$cona/terraform" workspace select -or-create "$envi"
[[ $action != init ]] || exit 0
# Always set TF_WORKSPACE explicitly; don't rely on this side effect
TF_VAR_giha=$(mise giha) TF_VAR_tabr=$(mise tabr) TF_WORKSPACE=$envi \
    "$INSH_TF" -chdir="deploys/$cona/terraform" "$action" "$@"
"""

# Leaf tasks
[tasks.actionlint]
run = '''
#!/usr/bin/env bash
set -o errexit -o nounset -o pipefail
# dup .config/setup.bash proxy_ca
proxy_ca=/root/.ccr/agent-proxy-ca.crt
if [[ -f $proxy_ca ]] \
    && ! openssl x509 -in $proxy_ca -noout -ext keyUsage 2>/dev/null | grep -q "Key Usage"
then
    echo 'Skipping actionlint because broken certificate' >&2
    exit 0
fi
actionlint "$@"
'''

[tasks.bash]
run = 'env bash --login -o errexit -o pipefail'

[tasks.basedpyright]
run = 'mise run-on-sources basedpyright "*.py{,i}" --level error "$@"'

[tasks.build]
run = '''
#!/usr/bin/env bash
set -o errexit -o nounset -o pipefail
rm -rf dist
uv build
uv publish --dry-run dist/*
uvx twine check --strict dist/*
if [[ -f Dockerfile && -f compose.yaml ]]; then
    docker compose --progress=plain build "$@"
fi
'''

[tasks.cookiecutter]
run = '''
#!/usr/bin/env bash
set -o errexit -o nounset -o pipefail
tabr=$(mise tabr)
if [[ ${1-} =~ ^(-e|--edit)$ ]]; then
    template=${2:-$HOME/code/measles}
elif [[ ${CONA-$(mise cona)} == measles && ${ORGN-$(mise orgn)} == biobuddies \
    && $tabr != main ]]; then
    template=.
else
    template=https://github.com/biobuddies/measles.git
fi
cookiecutter --config-file .cookiecutter.yaml --no-input --overwrite-if-exists $template
'''

[tasks.django-upgrade]
run = 'mise run-on-sources django-upgrade \*.py "$@"'

[tasks.deploy]
run = 'mise tapply "$@"'

[tasks.djlint-django]
# Resolve long attribute and other potential formatting differences in favor of prettier
run = '''
mise run-on-sources djlint \*.dj.html --quiet --reformat --profile=django "$@" || test $? -eq 1
mise run-on-sources prettier \*.dj.html --write "$@"
mise run-on-sources djlint \*.dj.html --lint --quiet --profile=django "$@"
'''

[tasks.djlint-jinja-html]
# Resolve long attribute and other potential formatting differences in favor of prettier
run = '''
mise run-on-sources djlint \*.j2.html --quiet --reformat --profile=jinja "$@" || test $? -eq 1
mise run-on-sources prettier \*.j2.html --write "$@"
mise run-on-sources djlint \*.j2.html --lint --quiet --profile=jinja "$@"
'''

[tasks.djlint-jinja-yaml]
# djlint hopefully does some Jinja linting and autoformatting. This configuration avoids
# mangling YAML.
# Workflow templates use YAML-shaped Jinja indentation that djlint flattens.
# Suppress return code 1 for reformatted to avoid aborting sibling tasks
run = '''
mise run-on-sources djlint \*.j2.yaml \
    --no-function-formatting --preserve-blank-lines --preserve-leading-space --quiet --reformat \
    --profile=jinja "$@" || test $? -eq 1
'''

[tasks.end-of-file-fixer]
run = 'mise run-on-sources end-of-file-fixer . "$@"'

[tasks.hadolint]
run = 'mise run-on-sources hadolint "*Dockerfile*" "$@"'

[tasks.helicopyter]
run = 'python -m helicopyter --format_with="$INSH_TF" all "$@"'

[tasks.lychee]
run = 'lychee --no-progress "$@" .'

[tasks.mailmap]
run = """
#!/usr/bin/env bash
set -o errexit -o nounset -o pipefail
git rev-parse --is-inside-work-tree HEAD >/dev/null 2>&1 || exit 0
emails_names=$(git log --format='%aE%x09%aN' --use-mailmap "$@" | sort --unique)
return_code=0
for repeat in $(echo "$emails_names" | cut -f 1 | uniq --repeated); do
    echo "$emails_names" | grep "$repeat"
    echo
    return_code=1
done
[[ $return_code == 0 ]] || echo 'Multiple names are associated with the same email address.'
exit $return_code
"""

[tasks.check-branch]
run = """
#!/usr/bin/env bash
set -o errexit -o nounset -o pipefail
[[ ${GITHUB_HEAD_REF:-$(git branch --show-current)} =~ ^[a-z0-9]+(-[a-z0-9]+)*$ ]] && exit 0
echo 'Branch names must use lowercase letters and digits separated by single hyphens.' >&2
exit 1
"""

[tasks.no-field-separators]
run = """
#!/usr/bin/env bash
set -o errexit -o nounset -o pipefail
paths=''
while read -r -d '' path; do
    [[ $path == *[$' \t\n']* ]] || continue
    paths+="$path"$'\n'
done < <(git ls-files -z)
[[ -z $paths ]] && exit 0
echo 'Tracked paths must not contain Bash IFS characters:'
printf '%s' "$paths"
exit 1
"""

[tasks.checkout]
# Usage: mise checkout [[ORGN/]CONA[@TABR]...]
# Clone arguments and .cookiecutter.yaml peer_checkouts
# Ensure ~/code/$CONA works (../$CONA doesn't everywhere)
run = '''
#!/usr/bin/env bash
set -o errexit -o nounset -o pipefail
commands=$(python - "$(git rev-parse --show-toplevel)" "$@" <<'EOD'
from pathlib import Path
from shlex import join, quote
from sys import argv

from yaml import safe_load

toplevel = Path(argv[1])
code = Path.home() / 'code'
organizations = {
    'gitignore': 'github',
    'helicopyter': 'biobuddies',
    'measles': 'biobuddies',
    'speedrun': 'biobuddies',
    'terraform-provider-cloudflare': 'cloudflare',
    'wriggle': 'biobuddies',
}
cookiecutter = toplevel / '.cookiecutter.yaml'
required = (safe_load(cookiecutter.read_text()) if cookiecutter.exists() else {}).get(
    'default_context', {}
).get('peer_checkouts', [])
print(join(['mkdir', '-p', str(code)]))
paths = [toplevel]
for peer in [*required, *argv[2:]]:
    repository, _, tabr = (peer if '@' in peer else f'{peer}@main').partition('@')
    repository = repository if '/' in repository else f'{organizations[repository]}/{repository}'
    paths.append(path := toplevel.parent / repository.split('/')[-1])
    print(
        join(['git', '-C', str(path), 'fetch', 'origin', tabr])
        if path.exists()
        else join([
            'git',
            'clone',
            f'--branch={tabr}',
            '--filter=blob:none',
            f'https://github.com/{repository}.git',
            str(path),
        ])
    )
for path in paths if toplevel.parent != code else []:
    print(f'[[ -e {quote(str(code / path.name))} ]] || ' + join(['ln', '-s', str(path), str(code)]))
EOD
)
eval "$commands"
'''

[tasks.prettier-write]
# Prettier incorporated into djlint tasks to reconcile formatting differences
# Skip Markdown to conserve vertical space.
# The Jinja parser's HTML layout mangles Jinja JSON; djlint handles Jinja YAML.
run = '''
mise run-on-sources prettier "*.{css,html,js,json,jsx,toml,ts,tsx,yaml} :!*.dj.html :!*.j2.html :!*.j2.json :!*.j2.yaml" \
    --write "$@"
'''

[tasks.pyrefly]
run = 'mise run-on-sources pyrefly "*.py{,i}" check "$@"'

[tasks.release]
run = '''
#!/usr/bin/env bash
set -o errexit -o nounset -o pipefail
prefix=$(date -u '+v%Y.%-U.')
git fetch --tags
latest=$(git tag --list "$prefix*" --sort=-version:refname | head -1)
count=${latest#"$prefix"}
gh release create "$prefix$((${count:-0} + 1))" --generate-notes
git fetch --tags
'''

[tasks.ruff-check-fix]
run = 'mise run-on-sources ruff "*.py{,i}" check --force-exclude --fix "$@"'

[tasks.ruff-format]
run = 'mise run-on-sources ruff "*.{md,py,pyi}" format --force-exclude "$@"'

[tasks.set-environment]
run = """
#!/usr/bin/env bash
set -o errexit -o nounset -o pipefail
cat <<EOD | tee -a "${GITHUB_ENV:-/tmp/flan.ini}"
CONA=helicopyter
ENVI=$(mise envi)
FQDN=$(mise fqdn)
GIHA=$(mise giha)
ORGN=biobuddies
ROLE=${ROLE-}
TABR=$(mise tabr)
EOD
set -o allexport
# shellcheck disable=SC1090
source "${GITHUB_ENV:-/tmp/flan.ini}"
"""

[tasks.shellcheck]
run = 'mise run-on-sources shellcheck "*.{bash,sh}" "$@"'

[tasks.shfmt]
run = '''
mise run-on-sources shfmt "*.{bash,sh}" \
    --binary-next-line --case-indent --simplify --write \
    --indent 4 --language-dialect bash "$@"
'''

[tasks.styleforce]
run = 'AUTOFORMAT_EXCLUDES=${AUTOFORMAT_EXCLUDES-} mise run-on-sources styleforce "*.py{,i}" "$@"'

[tasks.tabularize]
run = """
#!/usr/bin/env bash
set -o errexit -o nounset -o pipefail
cat <<EOD | tee "${GITHUB_STEP_SUMMARY:-/dev/null}"
| Unabbreviat. | FLAN | Value        |
| ------------ | ---- | ------------ |
| COdeNAme     | CONA | helicopyter |
| ENVIronment  | ENVI | $(mise envi) |
| Fully Qualified Domain Name | FQDN | $(mise fqdn) |
| GIt HAsH     | GIHA | $(mise giha) |
| ORGanizatioN | ORGN | biobuddies |
| ROLE         | ROLE | ${ROLE-} |
| TAg/BRanch   | TABR | $(mise tabr) |
EOD
"""

[tasks.tapply]
run = 'mise tact apply "$@"'

[tasks.test]
run = '''
#!/usr/bin/env bash
set -o errexit -o nounset -o pipefail
python -m pytest --cov${PYTEST_COV-} \
    --cov-report=term-missing:skip-covered --verbose "$@"
'''

[tasks.tplan]
run = 'mise tact plan "$@"'

[tasks.trailing-whitespace-fixer]
run = 'mise run-on-sources trailing-whitespace-fixer . "$@"'

[tasks.tvalid]
run = 'mise tact validate "$@"'

[tasks.npm-package-lock]
run = 'npm install --package-lock-only "$@"'

[tasks.typos]
run = 'mise run-on-sources typos "*" --write-changes --config .biobuddies/typos.toml "$@"'

[tasks.uv-pip-check]
run = 'uv pip check "$@"'

# dup :25 hooks.postinstall
[tasks.uv-pip-compile]
run = '''
#!/usr/bin/env bash
set -o errexit -o nounset -o pipefail
# Styleforce wheels require manylinux 2.28; uv's generic linux target assumes manylinux 2.17.
uv pip compile --all-extras --output-file requirements.txt --quiet \
    --python-platform x86_64-manylinux_2_28 \
    --python-version 3.12 pyproject.toml "$@"
[[ $(mise envi) != local ]] || git add requirements.txt
'''

[tasks.update-lock-files]
depends = ['npm-package-lock', 'uv-pip-compile']

[tasks.validate-pyproject]
run = 'validate-pyproject pyproject.toml "$@"'

[tasks.wait-actions]
run = 'mise x -- gh run list --branch $(git branch --show-current) --limit 1 --json databaseId --jq ".[0].databaseId" | xargs -I {} mise x -- gh run watch {}'

[tasks.yamllint]
# Jinja tags are invalid YAML; djlint handles Jinja YAML.
run = 'mise run-on-sources yamllint "*.yaml :!*.j2.yaml" "$@"'

# Task collections
[tasks.parallel-pre-commit]
depends = [
    # line changers
    'django-upgrade',
    'djlint-django',
    'djlint-jinja-html',
    'djlint-jinja-yaml',
    'end-of-file-fixer',
    'prettier-write',
    'ruff-check-fix',
    'ruff-format',
    'shfmt',
    'trailing-whitespace-fixer',
    'typos',
    # line keepers
    'actionlint',
    'check-branch',
    'hadolint',
    'mailmap',
    'no-field-separators',
    'pyrefly',
    'shellcheck',
    'uv-pip-check',
    'validate-pyproject',
    'yamllint',
]

# Would name this pre-commit-fast to avoid substring-matching identifiers, but mise's built-in
# hook generator defaults to this name
[tasks.pre-commit]
run = '''
#!/usr/bin/env bash
set -o errexit -o nounset -o pipefail
export AUTOFORMAT_EXCLUDES=$(sed -nE '/^#|^$/!p' .biobuddies/autoformat-excludes \
    .config/autoformat-excludes 2>/dev/null)
mise parallel-pre-commit
# dup :435 tasks.pre-commit-all
[[ $(mise envi) == local ]] || { git diff --color=always --exit-code; exit $?; }
# Stage once where the parallel run-on-sources tasks join; concurrent git add raced index.lock
# dup :71 tasks.run-on-sources
mapfile -t staged < <(
    git diff --name-only \
        | grep --invert-match --extended-regexp --file <(
            printf %s "$AUTOFORMAT_EXCLUDES"
        ) || [[ $? -eq 1 ]]
)
[[ -z ${staged[*]} ]] || git add -- "${staged[@]}"
git diff --cached --quiet || echo Auto-staged modifications
'''

[tasks.pre-commit-all]
run = '''
#!/usr/bin/env bash
set -o errexit -o nounset -o pipefail
mise cookiecutter "$@"  # needs Internet
mise pre-commit "$@"
mise lychee  # Requires Internet
mise uv-pip-compile  # needs Internet
# dup :414 tasks.pre-commit
[[ $(mise envi) == local ]] || { git diff --color=always --exit-code; exit $?; }
git diff --cached --quiet || echo Auto-staged modifications
'''

[tools]
# latest gh from ~/.config/mise/config.toml
lychee = '0.23.0'
node = '24'
# python from uv
uv = '0.12.5'
